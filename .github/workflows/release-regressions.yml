name: Release regressions
on:
  pull_request:
  push:
    branches: [main, master, "codex/**"]
permissions:
  contents: read
jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Read the exact pnpm version from package.json (single source of truth).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-regression-evidence
          path: output/release-regressions
