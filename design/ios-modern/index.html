<!doctype html>
<html lang="en-AU">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Tattoi Lock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: every page is a calm sky, a slow gradient with two drifting lights, under one big thin figure.
   Frosted modules rise from the lowest fifth and scroll over the sky. Pages swipe sideways; a dock at the
   bottom carries the page dots, as in iOS Weather. One deliberate visual world: white type on sky, with
   colour used only to mark status. Apple devices get SF Pro; everyone else gets Inter. */
:root {
  color-scheme: light;
  /* Tattoi Ivory palette from codex/tattoi-ivory-design-system (system.css). */
  --text: #29231e;
  --text-2: #5f574f;
  --text-3: #8a8178;
  --hair: #e5e0d9;
  --fill: rgba(41, 35, 30, 0.06);
  --fill-2: rgba(41, 35, 30, 0.1);
  --ink: #29231e;
  --stencil: #382c24;
  --surface-2: #efebe5;
  --line-strong: #d6cfc6;
  --on-white: #fffdfa;
  --good: #24644d;
  --wait: #8a6a1f;
  --bad: #9d342e;
  --stage: #e9e3da;
  --top: #3b78c4;
  --bottom: #8cbbe6;
  --tint: rgba(20, 55, 110, 0.22);
  --glowA: rgba(255, 255, 255, 0.38);
  --glowB: rgba(160, 210, 255, 0.4);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 16px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 10px; }
img { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ── Stage ── */
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 64px; }
#stage-bg { position: absolute; inset: 0; background: linear-gradient(180deg, var(--top), var(--bottom)); transition: background 0.8s; pointer-events: none; }
#stage-bg::after { content: ""; position: absolute; inset: 0; background: rgba(18, 22, 40, 0.45); }
#aside { display: none; position: relative; width: 250px; }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--stage); isolation: isolate; }
@media (min-width: 820px) and (min-height: 640px) {
  #aside { display: block; }
  #app { position: relative; inset: auto; width: 400px; height: min(866px, calc(100vh - 48px)); border-radius: 48px; box-shadow: 0 0 0 9px #11141f, 0 40px 90px -20px rgba(0, 0, 0, 0.5); }
}
.aside-mark { font-family: var(--font-display); font-size: 44px; font-weight: 200; letter-spacing: -0.02em; }
.aside-sub { margin: 8px 0 26px; color: var(--text-2); max-width: 30ch; line-height: 1.45; }
.aside-roles { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
.aside-roles button { padding: 8px 14px; border-radius: 999px; background: var(--fill); font-weight: 500; font-size: 14px; }
.aside-roles button[aria-pressed="true"] { background: #382c24; color: #fffdfa; }
.aside-pages { display: grid; gap: 2px; margin-bottom: 24px; }
.aside-pages button { text-align: left; padding: 5px 0; color: var(--text-3); font-size: 17px; font-weight: 400; }
.aside-pages button[aria-current="true"] { color: #fff; font-weight: 500; }
.aside-hint { font-size: 13px; color: var(--text-3); display: grid; gap: 6px; line-height: 1.4; }
.aside-hint kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--hair); border-radius: 5px; padding: 0 5px; }
.aside-reset { margin-top: 20px; font-size: 13px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; }

/* ── Sky ── */
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%); overflow: hidden; }
.sky i { position: absolute; border-radius: 50%; will-change: transform; }
.sky .a { width: 150%; height: 70%; left: -45%; top: -18%; background: radial-gradient(closest-side, var(--glowA), transparent); animation: driftA 40s ease-in-out infinite alternate; }
.sky .b { width: 140%; height: 65%; right: -55%; top: 38%; background: radial-gradient(closest-side, var(--glowB), transparent); animation: driftB 52s ease-in-out infinite alternate; }
@keyframes driftA { to { transform: translate3d(22%, 6%, 0) scale(1.12); } }
@keyframes driftB { to { transform: translate3d(-24%, -8%, 0) scale(0.92); } }

/* ── Pages ── */
#track { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
#track::-webkit-scrollbar { display: none; }
#track.dragging { scroll-snap-type: none; cursor: grabbing; user-select: none; }
.page { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
.scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.hero { min-height: calc(100% - max(240px, 35%)); display: flex; flex-direction: column; align-items: center; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 58px) var(--gr) 14px var(--gl);  will-change: transform, opacity; }
.h-kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-2); }
.h-title { font-family: var(--font-display); font-size: 34px; font-weight: 400; margin: 2px 0 0; line-height: 1.15; }
.h-big { font-family: var(--font-display); font-weight: 200; line-height: 1; letter-spacing: -0.035em; margin: 0; }
.h-cond { font-size: 20px; font-weight: 500; margin-top: 2px; }
.h-sub { font-size: 17px; font-weight: 500; color: var(--text-2); margin-top: 3px; max-width: 30ch; }
.h-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 360px; margin-top: 22px; }
.h-stats div { display: grid; gap: 2px; padding: 0 4px; border-left: 1px solid var(--hair); }
.h-stats div:first-child { border-left: 0; }
.h-stats b { font-family: var(--font-display); font-size: 22px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-stats span { font-size: 12.5px; color: var(--text-2); }
.horizon { margin-top: auto; width: 100%; max-width: 400px; padding-top: 18px; }
.horizon svg { display: block; width: 100%; height: auto; overflow: visible; }
.horizon text { fill: rgba(255, 255, 255, 0.7); font-size: 11px; font-family: var(--font); }
.deck { display: grid; gap: 12px; padding: 0 var(--gr) calc(env(safe-area-inset-bottom, 0px) + 104px) var(--gl); will-change: transform; }

/* ── Modules ── */
/* Apple-style glass: translucent fill, strong blur, a lit top edge and a soft drop shadow. */
.card { position: relative; background: linear-gradient(180deg, rgba(255,253,250,0.78), rgba(255,253,250,0.5)); -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6); border-radius: 22px; padding: 16px; min-width: 0; border: 1px solid rgba(255,255,255,0.9); box-shadow: inset 0 1px 0 #fff, 0 10px 30px -14px rgba(56,44,36,0.22); }
.card.tight { padding: 0 16px; }
.card.flat { background: var(--fill); }
.card h3 { margin: 0; font-size: 17px; font-weight: 600; }
.mh { display: flex; align-items: center; gap: 6px; padding: 11px 0 9px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-3); border-bottom: 0.5px solid var(--hair); }
.mh svg { width: 14px; height: 14px; }
.mh .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; color: var(--text-2); display: flex; gap: 4px; }
.mh .r button { padding: 4px 6px; border-radius: 6px; color: var(--text-3); }
.mh .r button[aria-pressed="true"] { color: #fff; background: var(--fill); }
.summary { padding: 12px 0; font-size: 16px; line-height: 1.4; border-bottom: 0.5px solid var(--hair); }
.summary:last-child { border-bottom: 0; }
.summary .btns { margin-top: 12px; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 2px -2px; }
.sec h2 { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-3); }
.sec .count { color: var(--text-3); }
.sec button, .link { color: #fff; font-weight: 600; font-size: 15px; min-height: 40px; display: inline-flex; align-items: center; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 14px; }
.big-num { font-family: var(--font-display); font-size: 52px; font-weight: 200; letter-spacing: -0.03em; line-height: 1; }
.mid-num { font-family: var(--font-display); font-size: 26px; font-weight: 300; letter-spacing: -0.01em; }
.stack { display: grid; gap: 10px; min-width: 0; }
.stack-s { display: grid; gap: 2px; min-width: 0; }
.hr { height: 0.5px; background: var(--hair); margin: 4px 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.split > :first-child { min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; min-height: 54px; width: 100%; text-align: left; border-bottom: 0.5px solid var(--hair); }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { display: block; color: var(--text-2); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.row .s.wrap { white-space: normal; }
.row .end { text-align: right; flex-shrink: 0; color: var(--text-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.row .chev { color: var(--text-3); flex-shrink: 0; display: flex; }
.row .chev svg { width: 16px; height: 16px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; flex-shrink: 0; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { aspect-ratio: 1; display: flex; flex-direction: column; text-align: left; padding: 0 14px 14px; }
.tile .mh { border: 0; padding: 12px 0 4px; }
.tile .tv { font-family: var(--font-display); font-size: 34px; font-weight: 300; line-height: 1.05; letter-spacing: -0.01em; }
.tile .tt { margin-top: auto; font-size: 14px; color: var(--text-2); line-height: 1.3; }
.gauge { position: relative; height: 5px; border-radius: 3px; background: linear-gradient(90deg, rgba(255,255,255,0.25), rgba(255,255,255,0.9)); margin: 10px 0 4px; }
.gauge b { position: absolute; top: -3px; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--top); margin-left: -5.5px; }

.hours { display: flex; overflow-x: auto; padding: 12px 0 14px; scrollbar-width: none; overscroll-behavior-x: contain; }
.hours::-webkit-scrollbar { display: none; }
.hours > * { flex: 0 0 58px; display: grid; justify-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
.hours .hh { color: var(--text); }
.hours .hi { width: 24px; height: 24px; display: grid; place-items: center; }
.hours .hi svg { width: 22px; height: 22px; }
.hours .free { color: var(--text-3); }
.wrow { display: grid; grid-template-columns: 56px 26px minmax(0, 1fr) 64px; align-items: center; gap: 10px; min-height: 50px; width: 100%; text-align: left; border-bottom: 0.5px solid var(--hair); font-size: 16px; }
.wrow:last-child { border-bottom: 0; }
.wrow .wd { font-weight: 500; }
.wrow .wi { display: grid; place-items: center; color: var(--text-2); }
.wrow .wi svg { width: 20px; height: 20px; }
.wrow .wv { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 15px; }
.wtrack { position: relative; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); }
.wtrack i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, rgba(255,255,255,0.75), #fff); }
.wtrack i.p { background: repeating-linear-gradient(90deg, rgba(255,255,255,0.8) 0 4px, transparent 4px 7px); }
.wtrack b { position: absolute; top: -3px; width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--top); margin-left: -5.5px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--fill); font-size: 13px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); }
.pill.good::before { background: var(--good); }
.pill.wait::before { background: var(--wait); }
.pill.bad::before { background: var(--bad); }
.pill.st::before { background: #fff; }
.pill svg { display: none; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 16px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); transition: transform 0.12s, background 0.2s; text-align: center; }
.btn:active { transform: scale(0.98); }
.btn.primary, .btn.stencil { background: #382c24; color: #fffdfa; border-color: #382c24; }
.btn.quiet { background: transparent; color: var(--text-2); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 15px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 19px; background: var(--fill); font-weight: 500; font-size: 15px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: #382c24; color: #fffdfa; }
.chip svg { width: 15px; height: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; padding: 2px; border-radius: 10px; background: var(--fill); gap: 2px; }
.seg button { flex: 1; min-height: 34px; border-radius: 8px; font-weight: 500; font-size: 14px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: #fffdfa; color: var(--text); box-shadow: 0 1px 3px rgba(41,35,30,0.12); }

.avatar { --h: 210; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: hsl(var(--h) 55% 86%); color: hsl(var(--h) 45% 26%); text-shadow: none; }
.avatar.lg { width: 64px; height: 64px; font-size: 22px; }
.avatar.sm { width: 32px; height: 32px; font-size: 12px; }
.thumb { border-radius: 12px; overflow: hidden; background: var(--fill); flex-shrink: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 14px; overflow: hidden; }
.grid3 > * { aspect-ratio: 1; display: block; overflow: hidden; }
.grid3 img { width: 100%; height: 100%; object-fit: cover; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.bar-track { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); overflow: hidden; display: flex; }
.bar-track i { display: block; height: 100%; background: #fff; border-radius: 3px; }

.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--text-2); }
.input { width: 100%; min-height: 46px; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--fill); font-size: 16px; color: #fff; }
.input::placeholder { color: var(--text-3); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.4; }
.input:focus { outline: 2px solid rgba(255, 255, 255, 0.8); outline-offset: 0; }
input[type="date"].input, input[type="time"].input { color-scheme: dark; }
input[type="range"] { accent-color: #fff; width: 100%; }
.search { position: relative; }
.search .input { padding-left: 40px; min-height: 40px; border-radius: 11px; background: rgba(255, 255, 255, 0.18); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-3); }
.switch { position: relative; width: 51px; height: 31px; border-radius: 16px; background: rgba(255, 255, 255, 0.24); flex-shrink: 0; transition: background 0.2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); transition: transform 0.25s var(--ease); }
.switch[aria-checked="true"] { background: #4cd28a; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--fill); font-size: 15px; line-height: 1.4; }
.note.st, .note.wait { background: var(--fill-2); }
.quote { border-left: 2px solid rgba(255, 255, 255, 0.5); padding-left: 12px; color: var(--text-2); }

.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gl) var(--gr); overscroll-behavior-x: contain; margin: 0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl)); padding: 2px var(--gr) 2px var(--gl); scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; flex-shrink: 0; }

.tl { display: grid; gap: 8px; }
.tl-item { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: start; }
.tl-item .when { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 15px; padding-top: 13px; }
.tl-block { border-radius: 14px; padding: 12px 14px; background: var(--fill); text-align: left; width: 100%; display: grid; gap: 4px; }
.tl-block.proposed { background: transparent; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4); }
.tl-block.done { opacity: 0.6; }
.tl-block.block { background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,0.1) 6px 7px); }

/* Messages */
.bubbles { display: grid; gap: 6px; padding: 8px var(--gr) 16px var(--gl); }
.bubble { max-width: 80%; padding: 9px 14px; border-radius: 19px; background: var(--fill-2); justify-self: start; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
.bubble.me { justify-self: end; background: #382c24; color: #fffdfa; }
.bubble.img { padding: 3px; width: 62%; background: var(--fill); }
.bubble.img img { border-radius: 16px; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.bubble-meta { font-size: 12px; color: var(--text-3); justify-self: start; margin: 0 8px 6px; }
.bubble-meta.me { justify-self: end; }
.sysmsg { justify-self: center; text-align: center; font-size: 13px; color: var(--text-2); max-width: 85%; padding: 6px 0; }
.daylabel { justify-self: center; font-size: 12px; font-weight: 600; color: var(--text-3); padding: 10px 0 2px; }
.msgcard { justify-self: stretch; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px var(--gr) calc(env(safe-area-inset-bottom, 0px) + 10px) var(--gl); }
.composer textarea { flex: 1; min-height: 40px; max-height: 120px; resize: none; border-radius: 20px; padding: 9px 16px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.solid { background: #382c24; color: #fffdfa; }
.icon-btn.glass { background: var(--fill); }
.tools { display: flex; gap: 8px; overflow-x: auto; padding: 10px var(--gr) 0 var(--gl); scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tools .chip { flex-shrink: 0; min-height: 32px; font-size: 13px; }

/* ── Chrome: account button, compact header, dock ── */
#who { position: absolute; z-index: 32; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(var(--gr) - 2px); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
#who .avatar { width: 34px; height: 34px; font-size: 12px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5); }
#bar { position: absolute; z-index: 30; inset: 0 0 auto; display: grid; justify-items: center; padding: calc(env(safe-area-inset-top, 0px) + 10px) 64px 10px; background: color-mix(in srgb, var(--top) 72%, transparent); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); opacity: 0; transform: translateY(-8px); transition: opacity 0.25s, transform 0.25s; pointer-events: none; text-align: center; }
#bar.solid { opacity: 1; transform: none; }
#bar .bt { font-size: 17px; font-weight: 600; }

/* ── Tattoi Lock ── the whole app lives on the lock screen: night-violet wallpaper, glass notifications */
:root, :root[data-theme] { --wall: linear-gradient(170deg, var(--base) 0%, var(--deep) 38%, #4b3592 72%, #7a4cad 100%); --glass: rgba(255,255,255,.14); --glass2: rgba(255,255,255,.22); --ink: #fff; --ink2: rgba(255,255,255,.82); --ink3: rgba(255,255,255,.6); --hair: rgba(255,255,255,.12); --card: var(--glass); --mist: transparent; --text: #fff; --text-2: rgba(255,255,255,.82); --text-3: rgba(255,255,255,.6); }
html:root body, html:root body #app, html:root body #stage-bg { background: var(--base) !important; }
html:root body .page, html:root body .sheet, html:root:not([data-theme="light"]) body .sheet, html:root[data-theme] body .sheet { background: var(--wall) fixed !important; color: #fff; }
.sheet::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(90% 40% at 85% 0%, rgba(255,255,255,.14), transparent 70%); }
.sheet-top.solid { background: rgba(var(--base-rgb),.6) !important; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.sheet-top .close { background: var(--glass) !important; color: #fff !important; }
.sheet-head h1 { color: #fff; } .sheet-head p { color: var(--ink2); }

.stage { background: none !important; box-shadow: none !important; padding: 8px 0; margin: 0 0 10px; } .stage::before { display: none; }
.land { padding: calc(env(safe-area-inset-top, 0px) + 54px) 14px 40px; }
.stage.lock { min-height: 0; padding-bottom: 8px; }
/* every surface is a notification */
.ctl, .tg, .room, .pb, .fs, .facts div, .sgroup, .url, .paper, .planpick button, .chips button, .search, .split-legend div, .keep, .lane, .drops div, .plainwrap .card, .plainwrap section, :root .card, :root .mod { background: var(--glass) !important; -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); color: #fff !important; border: 0 !important; box-shadow: none !important; }
.ctl, .tg, .room, .sgroup, .paper, .url { border-radius: 24px; }
.pb.accent { background: #fff !important; color: var(--deep) !important; } .pb.danger { color: var(--acc-soft) !important; }
.chips button[aria-pressed="true"] { background: #fff !important; color: var(--deep) !important; }
.plainwrap *, .ctl *, .room * { --text: #fff; } .plainwrap .faint, .plainwrap .small, .plainwrap .sub, .plainwrap .muted { color: var(--ink3) !important; }
.plainwrap .row, .plainwrap .card .row { border-color: var(--hair) !important; }
.input, input.input, textarea.input { background: rgba(255,255,255,.12) !important; color: #fff !important; border: 0 !important; }
.fs > i { opacity: .95; } .fs.on { background: var(--glass2) !important; }
.si, .rv-ic { box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.srow, .room, .led { color: #fff; } .room em, .srow em { color: var(--ink3); }
